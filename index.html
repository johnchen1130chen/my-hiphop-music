<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Beat - 2000-2010s 經典嘻哈誌</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">🎵 My Beat</div>
        <p class="subtitle">2000-2010s 嘻哈黃金年代：Lil Wayne、Kanye 與 Pitchfork 殿堂級曲目推薦</p>
    </header>

    <main>
        <!-- 分類篩選器 -->
        <section class="filter-container">
            <button class="filter-btn active" data-category="all">全部經典</button>
            <button class="filter-btn" data-category="Conscious Rap">Conscious Rap</button>
            <button class="filter-btn" data-category="Southern Hip Hop">Southern Hip Hop</button>
            <button class="filter-btn" data-category="Soul-Sample">Soul-Sample</button>
        </section>

        <!-- 音樂卡片展示區 -->
        <section class="music-grid" id="music-grid">
            <!-- JavaScript 將會動態在此插入卡片 -->
        </section>
    </main>

    <footer>
        <p>© 2023 My Beat - Golden Era Hip Hop. Powered by AGENTS.md Rule Engine.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
